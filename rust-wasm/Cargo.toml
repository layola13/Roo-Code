[workspace]
members = [
    "api-integration",
    "task-engine",
    "tools",
    "conversation",
    "memory",
]
resolver = "2"

[package]
name = "roo-core-wasm"
version = "0.1.0"
edition = "2021"
description = "Roo-Code Core - Unified WASM module for cross-platform AI coding assistant"
authors = ["Roo-Code Team"]
license = "MIT"
repository = "https://github.com/RooVetGit/Roo-Code"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# 子模块依赖
roo-api-integration = { path = "./api-integration" }
roo-task-engine = { path = "./task-engine" }
roo-tools = { path = "./tools" }
roo-conversation = { path = "./conversation" }
roo-memory = { path = "./memory" }

# WASM绑定
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
serde-wasm-bindgen = "0.6"

# 错误处理和工具
thiserror = { workspace = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
web-sys = "0.3"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
futures = "0.3"

# 发布配置 - 激进优化
[profile.release]
opt-level = "z"        # 优化文件大小
lto = true             # 链接时优化
codegen-units = 1      # 单个代码生成单元（更好的优化）
panic = "abort"        # 移除panic展开代码
strip = true           # 移除符号表

# 开发配置
[profile.dev]
opt-level = 0
debug = true

# wasm-pack配置
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = false
omit-default-module-path = false

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]